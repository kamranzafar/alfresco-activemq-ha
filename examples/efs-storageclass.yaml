# EFS StorageClass whose access points enforce the broker image's identity
# (alfresco/alfresco-activemq: uid 33031, gid 1000). Requires aws-efs-csi-driver.
# EFS supports the NFSv4 locking the shared-file-locker relies on.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: efs-amq
provisioner: efs.csi.aws.com
parameters:
  provisioningMode: efs-ap
  fileSystemId: fs-0123456789abcdef0     # <- your file system
  directoryPerms: "700"
  uid: "33031"
  gid: "1000"
  basePath: /activemq
reclaimPolicy: Retain
