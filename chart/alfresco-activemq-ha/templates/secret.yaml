{{- if not .Values.auth.existingSecret.name }}
{{- $k := .Values.auth.existingSecret.keys }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "amq.fullname" . }}
  labels:
    {{- include "amq.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ $k.adminUser }}: {{ .Values.auth.adminUser | quote }}
  {{ $k.adminPassword }}: {{ required "auth.adminPassword is required (or set auth.existingSecret.name)" .Values.auth.adminPassword | quote }}
  {{ $k.brokerUser }}: {{ .Values.auth.brokerUser | quote }}
  {{ $k.brokerPassword }}: {{ required "auth.brokerPassword is required (or set auth.existingSecret.name)" .Values.auth.brokerPassword | quote }}
{{- end }}
