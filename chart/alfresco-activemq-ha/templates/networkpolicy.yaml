{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
{{- if and (not $np.allowSameNamespace) (not $np.allowedNamespaceLabels) }}
{{- fail "networkPolicy: set allowSameNamespace and/or allowedNamespaceLabels (an empty source list would allow everything)" }}
{{- end }}
{{- $t := .Values.broker.transports }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "amq.fullname" . }}
  labels:
    {{- include "amq.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "amq.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- if $np.allowSameNamespace }}
        - podSelector: {}
        {{- end }}
        {{- range $np.allowedNamespaceLabels }}
        - namespaceSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
        {{- end }}
      ports:
        - { port: {{ $t.openwire.port | int }}, protocol: TCP }
        {{- if $t.stomp.enabled }}
        - { port: {{ $t.stomp.port | int }}, protocol: TCP }
        {{- end }}
        {{- if $t.amqp.enabled }}
        - { port: {{ $t.amqp.port | int }}, protocol: TCP }
        {{- end }}
        - { port: 8161, protocol: TCP }
{{- end }}
